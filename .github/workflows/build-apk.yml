name: Build Web & Export Android APK (Hóa Học THCS NĐH)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-web-and-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies & Build Web Bundle (dist)
        run: |
          npm install
          npm run build

      - name: Setup Java JDK 17 for Android APK Build
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Package Web Build into Android APK via Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --no-save
          npx cap add android || true
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../hoahoc-thcs-ndh.apk

      - name: Upload Compiled Web Bundle (Netlify Ready)
        uses: actions/upload-artifact@v4
        with:
          name: hoahoc-thcs-ndh-netlify-build
          path: dist/

      - name: Upload Android APK File (.APK)
        uses: actions/upload-artifact@v4
        with:
          name: hoahoc-thcs-ndh-android-apk
          path: hoahoc-thcs-ndh.apk
