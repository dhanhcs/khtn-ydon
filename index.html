<!doctype html>

    <script>
      // Suppress third-party browser extension noise (e.g. sender-wallet, crypto wallet extensions)
      (function() {
        function isNoiseText(text) {
          if (!text) return false;
          var s = String(text).toLowerCase();
          return (
            s.indexOf('sender-wallet') !== -1 ||
            s.indexOf('sender_getproviderstate') !== -1 ||
            s.indexOf('sender:') !== -1 ||
            s.indexOf('no account exist') !== -1 ||
            s.indexOf('notificationid') !== -1 ||
            s.indexOf('failed to get initial state') !== -1 ||
            s.indexOf('sender-wallet-providerresult') !== -1 ||
            s.indexOf('chrome-extension://') !== -1 ||
            s.indexOf('moz-extension://') !== -1
          );
        }

        function isNoise(arg) {
          if (!arg) return false;
          if (typeof arg === 'string') return isNoiseText(arg);
          if (arg instanceof Error && (isNoiseText(arg.message) || isNoiseText(arg.stack))) return true;
          try {
            var json = JSON.stringify(arg);
            if (isNoiseText(json)) return true;
          } catch (e) {}
          try {
            if (isNoiseText(arg.toString())) return true;
          } catch (e) {}
          return false;
        }

        function shouldSuppress(args) {
          for (var i = 0; i < args.length; i++) {
            if (isNoise(args[i])) return true;
          }
          return false;
        }

        // Intercept and wrap console error and warn
        ['error', 'warn', 'info'].forEach(function(method) {
          var original = console[method];
          if (typeof original === 'function') {
            var safeMethod = function() {
              if (shouldSuppress(arguments)) return;
              return original.apply(console, arguments);
            };
            try {
              Object.defineProperty(console, method, {
                get: function() { return safeMethod; },
                set: function(fn) { original = fn; },
                configurable: true,
                enumerable: true
              });
            } catch (err) {
              console[method] = safeMethod;
            }
          }
        });

        // Intercept message events in capture phase before extension handlers can log errors
        window.addEventListener('message', function(event) {
          try {
            var data = event.data;
            if (data && (data.type === 'sender-wallet-providerResult' || isNoise(data))) {
              if (data.response && data.response.error) {
                delete data.response.error;
                data.response.accountId = null;
                data.response.isSignedIn = false;
              }
              if (event.stopImmediatePropagation) event.stopImmediatePropagation();
              if (event.stopPropagation) event.stopPropagation();
            }
          } catch (e) {}
        }, true);

        // Intercept window error events
        window.addEventListener('error', function(event) {
          if (isNoise(event.message) || isNoise(event.filename) || isNoise(event.error)) {
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            if (event.preventDefault) event.preventDefault();
            return true;
          }
        }, true);

        // Intercept unhandled promise rejections
        window.addEventListener('unhandledrejection', function(event) {
          if (isNoise(event.reason)) {
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            if (event.preventDefault) event.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
